name: "Dependency Audit (npm)"

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Installs the pnpm version named by "packageManager" in vue/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: vue/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vue/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vue
        run: pnpm install --frozen-lockfile

      # Production dependencies only (what ships in the bundle).
      - name: Run pnpm audit
        working-directory: vue
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
